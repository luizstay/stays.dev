# stays.dev — TLS and public routing are managed by Easypanel.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doable}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required \u2014 run ./deployment/docker/setup.sh to generate}"
      POSTGRES_DB: ${POSTGRES_DB:-doable}
      DOABLE_APP_PASSWORD: "${DOABLE_APP_PASSWORD:?DOABLE_APP_PASSWORD is required \u2014 run ./deployment/docker/setup.sh\
        \ to generate}"
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ../docker/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    - ../docker/02-roles.sh:/docker-entrypoint-initdb.d/02-roles.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-doable}
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - DAC_OVERRIDE
    - FOWNER
    - SETGID
    - SETUID
  migrate:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-doable}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-doable}
    restart: 'no'
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
  api:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: api
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgres://doable_app:${DOABLE_APP_PASSWORD:?DOABLE_APP_PASSWORD is required \u2014 run ./deployment/docker/setup.sh\
        \ to generate}@postgres:5432/${POSTGRES_DB:-doable}"
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required \u2014 run ./deployment/docker/setup.sh to generate}"
      JWT_ISSUER: ${JWT_ISSUER:-doable}
      JWT_ACCESS_TOKEN_EXPIRES_IN: ${JWT_ACCESS_TOKEN_EXPIRES_IN:-15m}
      JWT_REFRESH_TOKEN_EXPIRES_IN: ${JWT_REFRESH_TOKEN_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY is required \u2014 run ./deployment/docker/setup.sh to generate}"
      DOABLE_KEK: "${DOABLE_KEK:?DOABLE_KEK is required \u2014 run ./deployment/docker/setup.sh to generate}"
      API_PORT: 4000
      API_HOST: 0.0.0.0
      CORS_ORIGINS: "${CORS_ORIGINS:?CORS_ORIGINS is required \u2014 run ./deployment/docker/setup.sh, or set it to the public\
        \ origin(s) e.g. \"https://app.example.com\"}"
      WS_PORT: 4001
      WS_HOST: 0.0.0.0
      INTERNAL_SECRET: "${INTERNAL_SECRET:?INTERNAL_SECRET is required \u2014 run ./deployment/docker/setup.sh to generate}"
      WS_INTERNAL_URL: http://ws:4001
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in Easypanel Environment}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?Set NEXT_PUBLIC_WS_URL in Easypanel Environment}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in Easypanel Environment}
      NODE_ENV: ${NODE_ENV:-production}
      PROJECTS_ROOT: ./projects
      SITES_DIR: /data/sites
      PUBLISH_BASE_URL: ${PUBLISH_BASE_URL:-${NEXT_PUBLIC_APP_URL:-http://localhost:3000}}
      PUBLISH_MODE: ${PUBLISH_MODE:-}
      DOABLE_APP_DB_ENABLED: ${DOABLE_APP_DB_ENABLED:-1}
      DOABLE_APP_DB_MEMORY_MB: ${DOABLE_APP_DB_MEMORY_MB:-128}
      DOABLE_APP_DB_MAX_WORKERS: ${DOABLE_APP_DB_MAX_WORKERS:-32}
      DOABLE_APP_DB_QUERY_TIMEOUT_MS: ${DOABLE_APP_DB_QUERY_TIMEOUT_MS:-5000}
      DOABLE_APP_DB_IDLE_MS: ${DOABLE_APP_DB_IDLE_MS:-600000}
      DOABLE_APP_AI_ENABLED: ${DOABLE_APP_AI_ENABLED:-1}
      INSTALL_BOOTSTRAP_TOKEN: ${INSTALL_BOOTSTRAP_TOKEN:-}
      INSTALL_BOOTSTRAP_TOKEN_EXPIRES_AT: ${INSTALL_BOOTSTRAP_TOKEN_EXPIRES_AT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${NEXT_PUBLIC_APP_URL}/oauth/github/login/callback
      GITHUB_COPILOT_REDIRECT_URI: ${NEXT_PUBLIC_APP_URL}/oauth/github/copilot/callback
      GITHUB_REPO_REDIRECT_URI: ${NEXT_PUBLIC_APP_URL}/oauth/github/repo/callback
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${NEXT_PUBLIC_APP_URL}/auth/google/callback
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-}
      DOABLE_HARDENING: ${DOABLE_HARDENING:-off}
      DOABLE_HARDENING_LEVEL: ${DOABLE_HARDENING_LEVEL:-off}
      DOABLE_SANDBOX_INSTALL: ${DOABLE_SANDBOX_INSTALL:-0}
    volumes:
    - api_projects:/app/services/api/projects
    - api_thumbnails:/app/services/api/thumbnails
    - doable_sites:/data/sites
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
  ws:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: ws
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgres://doable_app:${DOABLE_APP_PASSWORD:?DOABLE_APP_PASSWORD is required \u2014 run ./deployment/docker/setup.sh\
        \ to generate}@postgres:5432/${POSTGRES_DB:-doable}"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      WS_PORT: 4001
      WS_HOST: 0.0.0.0
      INTERNAL_SECRET: ${INTERNAL_SECRET:?INTERNAL_SECRET is required}
      API_URL: http://api:4000
      NODE_ENV: ${NODE_ENV:-production}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-${CORS_ORIGINS:-http://localhost:3000}}
      DOABLE_KEK: "${DOABLE_KEK:?DOABLE_KEK is required \u2014 run ./deployment/docker/setup.sh to generate}"
      DOABLE_PROJECTS_DIR: /app/services/ws/projects
    volumes:
    - ws_projects:/app/services/ws/projects
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
  web:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      ws:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in Easypanel Environment}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:?Set NEXT_PUBLIC_WS_URL in Easypanel Environment}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in Easypanel Environment}
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - doable_sites:/srv/sites:ro
    depends_on:
      api:
        condition: service_healthy
      ws:
        condition: service_healthy
      web:
        condition: service_started
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    cap_add:
    - NET_BIND_SERVICE
volumes:
  postgres_data: null
  api_projects: null
  api_thumbnails: null
  ws_projects: null
  doable_sites: null
